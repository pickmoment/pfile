[package]
name = "pfile"
version = "0.1.0"
description = "AI Content Explorer & Rich Previewer"
authors = ["pfile"]
edition = "2021"

[lib]
name = "pfile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.1"
notify-debouncer-mini = "0.4"
trash = "5"
walkdir = "2"
infer = "0.16"
tiktoken-rs = "0.6"
chrono = "0.4"
open = "5"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "rt", "time"] }
