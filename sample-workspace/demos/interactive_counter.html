<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Interactive Counter Prototype</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .count-display {
      font-size: 56px;
      font-weight: 800;
      margin: 24px 0;
      color: #38bdf8;
      font-family: monospace;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    button:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    button.reset {
      background: #475569;
      box-shadow: none;
    }
    button.reset:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Live Sandbox Demo</h1>
    <p style="color: #94a3b8; font-size: 14px;">Instant client-side interaction test</p>
    <div class="count-display" id="counter">0</div>
    <div class="btn-group">
      <button onclick="decrement()">- Decrement</button>
      <button class="reset" onclick="reset()">Reset</button>
      <button onclick="increment()">+ Increment</button>
    </div>
  </div>

  <script>
    let count = 0;
    const counterEl = document.getElementById('counter');

    function update() {
      counterEl.textContent = count;
    }

    function increment() {
      count++;
      update();
      console.log(`[Counter] Incremented to ${count} at ${new Date().toLocaleTimeString()}`);
    }

    function decrement() {
      count--;
      update();
      console.warn(`[Counter] Decremented to ${count}`);
    }

    function reset() {
      count = 0;
      update();
      console.info('[Counter] Reset back to zero');
    }

    console.log('Interactive Prototype Initialized in Sandbox.');
  </script>
</body>
</html>
